<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke-width: 1; rx: 8; }
      .title { font-weight: 600; font-size: 13px; }
      .sub { font-size: 11.5px; }
      .md { fill: #e1f5ee; stroke: #0f6e56; }
      .md text { fill: #04342c; }
      .aws { fill: #eeedfe; stroke: #534ab7; }
      .cust { fill: #faece7; stroke: #993c1d; }
      .vpc { fill: #fafaf8; stroke: #5f5e5a; stroke-dasharray: 6 4; }
      .tunnel { stroke: #1d9e75; stroke-width: 2.2; fill: none; stroke-dasharray: 7 5; }
      .flow { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
      .lbl { font-size: 11px; fill: #5f5e5a; }
    </style>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>

  <!-- MotherDuck row -->
  <text x="40" y="34" class="title" fill="#0f6e56">MotherDuck</text>
  <g class="md">
    <rect class="box" x="40" y="46" width="200" height="60"/>
    <text x="140" y="70" text-anchor="middle" class="title" fill="#04342c">Ingest Flight</text>
    <text x="140" y="90" text-anchor="middle" class="sub" fill="#085041">dlt + SSM tunnel, F16</text>
  </g>
  <g class="md">
    <rect class="box" x="300" y="46" width="200" height="60"/>
    <text x="400" y="70" text-anchor="middle" class="title" fill="#04342c">raw schema</text>
    <text x="400" y="90" text-anchor="middle" class="sub" fill="#085041">append-only, every version</text>
  </g>
  <g class="md">
    <rect class="box" x="560" y="46" width="180" height="60"/>
    <text x="650" y="70" text-anchor="middle" class="title" fill="#04342c">Transform Flight</text>
    <text x="650" y="90" text-anchor="middle" class="sub" fill="#085041">SQL only, MERGE INTO</text>
  </g>
  <g class="md">
    <rect class="box" x="780" y="46" width="150" height="60"/>
    <text x="855" y="70" text-anchor="middle" class="title" fill="#04342c">curated schema</text>
    <text x="855" y="90" text-anchor="middle" class="sub" fill="#085041">one row per key</text>
  </g>
  <line x1="240" y1="76" x2="298" y2="76" class="flow" marker-end="url(#arrow)"/>
  <text x="269" y="68" text-anchor="middle" class="lbl">append</text>
  <line x1="500" y1="76" x2="558" y2="76" class="flow" marker-end="url(#arrow)"/>
  <line x1="740" y1="76" x2="778" y2="76" class="flow" marker-end="url(#arrow)"/>
  <!-- trigger arrow: ingest -> transform, routed above -->
  <path d="M140 46 L140 22 L650 22 L650 44" class="flow" marker-end="url(#arrow)"/>
  <text x="395" y="17" text-anchor="middle" class="lbl">MD_RUN_FLIGHT(config := tables, raw location) after the tunnel is closed</text>

  <!-- AWS control plane -->
  <text x="40" y="170" class="title" fill="#534ab7">AWS (public API)</text>
  <g class="aws">
    <rect class="box" x="40" y="182" width="200" height="60"/>
    <text x="140" y="206" text-anchor="middle" class="title" fill="#26215c">Systems Manager</text>
    <text x="140" y="226" text-anchor="middle" class="sub" fill="#3c3489">brokers the session</text>
  </g>
  <path d="M100 106 L100 180" class="tunnel" marker-end="url(#arrow)"/>
  <text x="108" y="150" class="lbl">StartSession (boto3) + plugin</text>

  <!-- Customer VPC -->
  <rect class="vpc" x="40" y="280" width="890" height="160" rx="14"/>
  <text x="56" y="302" class="title" fill="#2c2c2a">Customer VPC</text>
  <text x="56" y="318" class="sub" fill="#5f5e5a">private subnets, no internet gateway, no NAT</text>
  <g class="aws">
    <rect class="box" x="40" y="340" width="200" height="60"/>
    <text x="140" y="364" text-anchor="middle" class="title" fill="#26215c">SSM interface endpoints</text>
    <text x="140" y="384" text-anchor="middle" class="sub" fill="#3c3489">ssm, ssmmessages, ec2messages</text>
  </g>
  <g class="cust">
    <rect class="box" x="330" y="340" width="200" height="60"/>
    <text x="430" y="364" text-anchor="middle" class="title" fill="#4a1b0c">Bastion EC2</text>
    <text x="430" y="384" text-anchor="middle" class="sub" fill="#712b13">SSM agent, no public IP</text>
  </g>
  <g class="cust">
    <rect class="box" x="660" y="340" width="200" height="60"/>
    <text x="760" y="364" text-anchor="middle" class="title" fill="#4a1b0c">RDS Postgres</text>
    <text x="760" y="384" text-anchor="middle" class="sub" fill="#712b13">publicly_accessible = false</text>
  </g>
  <!-- bastion agent dials out to SSM through the endpoints -->
  <path d="M330 370 L240 370" class="tunnel" marker-end="url(#arrow)"/>
  <path d="M140 340 L140 244" class="tunnel" marker-end="url(#arrow)"/>
  <text x="150" y="268" class="lbl">agent dials OUT (no inbound path)</text>
  <!-- bastion -> rds -->
  <line x1="530" y1="370" x2="658" y2="370" class="flow" marker-end="url(#arrow)"/>
  <text x="594" y="362" text-anchor="middle" class="lbl">5432</text>

  <!-- legend -->
  <line x1="560" y1="200" x2="600" y2="200" class="tunnel"/>
  <text x="608" y="204" class="lbl">tunnel traffic: both ends connect outbound to Systems Manager</text>
  <line x1="560" y1="222" x2="600" y2="222" class="flow"/>
  <text x="608" y="226" class="lbl">data / control flow</text>
  <text x="560" y="250" class="lbl">Postgres is read inside the Flight (127.0.0.1:15432); only finished rows travel to MotherDuck.</text>
</svg>
