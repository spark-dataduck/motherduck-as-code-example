<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { stroke-width: 1; rx: 8; }
      .title { font-weight: 600; font-size: 13px; }
      .sub { font-size: 11.5px; }
      .md { fill: #e1f5ee; stroke: #0f6e56; }
      .cust { fill: #faece7; stroke: #993c1d; }
      .flow { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
      .lbl { font-size: 11px; fill: #5f5e5a; }
    </style>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <!-- MotherDuck row -->
  <text x="40" y="34" class="title" fill="#0f6e56">MotherDuck</text>
  <g class="md">
    <rect class="box" x="40" y="46" width="200" height="60"/>
    <text x="140" y="70" text-anchor="middle" class="title" fill="#04342c">Ingest Flight</text>
    <text x="140" y="90" text-anchor="middle" class="sub" fill="#085041">dlt, direct connection</text>
  </g>
  <g class="md">
    <rect class="box" x="300" y="46" width="200" height="60"/>
    <text x="400" y="70" text-anchor="middle" class="title" fill="#04342c">raw schema</text>
    <text x="400" y="90" text-anchor="middle" class="sub" fill="#085041">append-only, every version</text>
  </g>
  <g class="md">
    <rect class="box" x="560" y="46" width="180" height="60"/>
    <text x="650" y="70" text-anchor="middle" class="title" fill="#04342c">Transform Flight</text>
    <text x="650" y="90" text-anchor="middle" class="sub" fill="#085041">SQL only, delete+insert</text>
  </g>
  <g class="md">
    <rect class="box" x="780" y="46" width="150" height="60"/>
    <text x="855" y="70" text-anchor="middle" class="title" fill="#04342c">curated schema</text>
    <text x="855" y="90" text-anchor="middle" class="sub" fill="#085041">one row per key</text>
  </g>
  <line x1="240" y1="76" x2="298" y2="76" class="flow" marker-end="url(#arrow)"/>
  <text x="269" y="68" text-anchor="middle" class="lbl">append</text>
  <line x1="500" y1="76" x2="558" y2="76" class="flow" marker-end="url(#arrow)"/>
  <line x1="740" y1="76" x2="778" y2="76" class="flow" marker-end="url(#arrow)"/>
  <path d="M140 46 L140 22 L650 22 L650 44" class="flow" marker-end="url(#arrow)"/>
  <text x="395" y="17" text-anchor="middle" class="lbl">MD_RUN_FLIGHT(config := tables, raw location) after a clean load</text>

  <!-- Postgres -->
  <text x="40" y="186" class="title" fill="#993c1d">Your Postgres (reachable over the internet)</text>
  <g class="cust">
    <rect class="box" x="40" y="198" width="200" height="60"/>
    <text x="140" y="222" text-anchor="middle" class="title" fill="#4a1b0c">Postgres</text>
    <text x="140" y="242" text-anchor="middle" class="sub" fill="#712b13">TLS, read-only user</text>
  </g>
  <path d="M100 198 L100 108" class="flow" marker-end="url(#arrow)"/>
  <text x="108" y="150" class="lbl">SELECT ... WHERE updated_at >= last cursor</text>
  <text x="108" y="164" class="lbl">(cursor restored from _dlt_pipeline_state)</text>

  <!-- vendors -->
  <text x="300" y="206" class="lbl">Neon · Supabase · Amazon RDS / Aurora (public) · Google Cloud SQL (public IP) · Azure Flexible Server</text>
  <text x="300" y="224" class="lbl">Heroku · Render · Crunchy Bridge · Railway · DigitalOcean · Aiven · Timescale · self-hosted</text>
  <text x="300" y="252" class="lbl">Hosts with an IP allow list need the Flight egress IPs for your MotherDuck region.</text>
  <text x="300" y="270" class="lbl">Postgres is read inside the Flight; only finished rows travel to MotherDuck.</text>
</svg>
